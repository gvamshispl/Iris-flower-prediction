<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris Flower Prediction</title>
    <style>
        body { 
            /* Updated background handling */
            background-image: url('/static/flower.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            /* Added transparency so background is visible */
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 350px; 
            text-align: center; 
        }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        #result-box { margin-top: 25px; padding: 15px; border-top: 1px solid #eee; }
        .flower-name { font-size: 1.5em; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Iris Flower Prediction</h2>
        <input type="number" id="f1" step="0.1" placeholder="Sepal Length (cm)">
        <input type="number" id="f2" step="0.1" placeholder="Sepal Width (cm)">
        <input type="number" id="f3" step="0.1" placeholder="Petal Length (cm)">
        <input type="number" id="f4" step="0.1" placeholder="Petal Width (cm)">
        <button onclick="sendPredict()">Identify Flower</button>
        
        <div id="result-box">
            <div>Prediction:</div>
            <div id="flower-result" class="flower-name">--</div>
        </div>
    </div>

    <script>
        const labelMap = {
            0: "Setosa",
            1: "Versicolor",
            2: "Virginica"
        };

        async function sendPredict() {
            const features = [
                parseFloat(document.getElementById('f1').value),
                parseFloat(document.getElementById('f2').value),
                parseFloat(document.getElementById('f3').value),
                parseFloat(document.getElementById('f4').value)
            ];

            // Basic validation
            if (features.some(isNaN)) {
                alert("Please enter all four measurements.");
                return;
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({features})
                });
                const data = await response.json();
                
                const name = labelMap[data.prediction] || "Unknown Class " + data.prediction;
                document.getElementById('flower-result').innerText = name;
            } catch (e) {
                document.getElementById('flower-result').innerText = "Error!";
            }
        }
    </script>
</body>
</html>
